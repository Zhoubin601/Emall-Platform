version: 2
updates:
  - package-ecosystem: maven
    directory: /mall-backend
    schedule:
      interval: monthly
      timezone: Asia/Shanghai
    open-pull-requests-limit: 0
    groups:
      maven-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /emall-client
    schedule:
      interval: monthly
      timezone: Asia/Shanghai
    open-pull-requests-limit: 0
    groups:
      client-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /emall-admin
    schedule:
      interval: monthly
      timezone: Asia/Shanghai
    open-pull-requests-limit: 0
    groups:
      admin-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Asia/Shanghai
    open-pull-requests-limit: 0
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

